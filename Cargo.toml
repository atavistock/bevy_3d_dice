[package]
name = "bevy_3d_dice"
description = "Physics-driven dice for Bevy 0.20. Parse a dice expression, roll it in an arena, watch the dice tumble and settle, read the result."
version = "0.5.0"
edition = "2024"
license = "BSD-2-Clause-Patent"
repository = "https://github.com/atavistock/bevy_3d_dice"

[features]
# Each feature embeds the indicated diceset gltf into the binary so callers
# can use it with no asset setup. The textured dicesets (frosty ~95 MB,
# fiery ~76 MB) are deliberately not feature-gated; ship those by writing
# them into your own `assets/` directory.
plain_white = []
halloween = []
metal = []
clear_orange = []

[dependencies]
avian3d = { version = "0.8.0", default-features = false, features = [
  "3d",
  "parry-f32",
  "parallel",
] }
# Bundled dicesets contain both JPEG and PNG textures.
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "async_executor",
  "bevy_asset",
  "bevy_gltf",
  "bevy_pbr",
  "jpeg",
  "png",
] }
rand = "0.8"
# Used only to read the `extras.dice_orientations` JSON block out of diceset
# gltf files. Already in the dependency tree via bevy's gltf loader.
serde_json = "1"

[dev-dependencies]
bevy = { version = "0.20", default-features = false, features = [
  "bevy_winit",
  "bevy_log",
  "bevy_ui_render",
  "bevy_gizmos_render",
  "default_font",
  "tonemapping_luts",
  "zstd_rust",
  "x11",
  "wayland",
] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[[example]]
name = "simple_d20"
required-features = ["plain_white"]

[[example]]
name = "dice_expressions"
required-features = ["plain_white"]

[[example]]
name = "isolated_layer"
required-features = ["plain_white"]

[[example]]
name = "two_arenas"
required-features = ["plain_white", "halloween"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
